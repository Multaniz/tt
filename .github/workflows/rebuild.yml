name: rebuild
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
  push:
    paths: ['feedDedupe.js', 'prelude.js', 'build.mjs']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node test/feedDedupe.test.mjs
      - run: node build.mjs
      - name: Commit when the bundle changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add dist/userScript.js
          git diff --cached --quiet || (git commit -m "Rebuild bundle" && git push)
